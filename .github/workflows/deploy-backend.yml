# Backend CI/CD — Cloud Run deployment
#
# Triggered on every push to `main` and via manual workflow_dispatch.
# Flow: checkout → authenticate to GCP → run DB migrations → deploy to Cloud Run.
#
# ──────────────────────────────────────────────────────────────────────────────
# AUTHENTICATION NOTE
#
# This workflow uses a Service Account JSON key stored in the GH secret
# GCP_SA_KEY (simplest to set up for small teams).
#
# RECOMMENDED UPGRADE — Workload Identity Federation (WIF):
# WIF eliminates long-lived key files entirely. Instead, GitHub's OIDC provider
# issues a short-lived token that GCP verifies directly.
# Steps to migrate:
#   1. Create a Workload Identity Pool in GCP (IAM → Workload Identity Federation).
#   2. Create a provider for https://token.actions.githubusercontent.com.
#   3. Grant the service account the role roles/iam.workloadIdentityUser bound
#      to the attribute principalSet://iam.googleapis.com/.../attribute.repository/<org>/<repo>.
#   4. Replace the `credentials_json` input in the auth step below with:
#        workload_identity_provider: 'projects/332865216810/locations/global/workloadIdentityPools/<pool>/providers/<provider>'
#        service_account: 'deploy-sa@<project>.iam.gserviceaccount.com'
#      and delete the GCP_SA_KEY secret entirely.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deploys on overlapping pushes to main.
# A second push will cancel any in-progress run and start fresh.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-deploy:
    name: Migrate → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Cloud Run service details — kept here so they're visible without
      # needing to dig through step definitions.
      CLOUD_RUN_SERVICE: jokesforbackend
      REGION: us-east1

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Authenticate to GCP ─────────────────────────────────────────────
      # Using SA key JSON stored in GH secret GCP_SA_KEY.
      # To upgrade to Workload Identity Federation, see the comment block at the
      # top of this file.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ── 3. Set up gcloud CLI ───────────────────────────────────────────────
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      # ── 4. Set up Python for the migration step ────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Run Django migrations against Neon (prod DB) ────────────────────
      #
      # Migrations MUST run before the new revision goes live so that any new
      # schema (columns, tables, constraints) exists before new code tries to
      # query it — otherwise Cloud Run will serve 500s on the first request.
      #
      # SECRET_KEY note: settings.py raises ImproperlyConfigured when
      # DEBUG=False and SECRET_KEY is absent. The migrate command doesn't need
      # the real production key (it never signs tokens), so we pass DEBUG=True
      # here to bypass that guard cleanly — avoids exposing the real key in the
      # runner environment while still being able to boot Django.
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost"
        run: python manage.py migrate --noinput

      # ── 6. Deploy to Cloud Run via Cloud Build ─────────────────────────────
      #
      # `--source .` triggers a Cloud Build job that builds the Dockerfile and
      # rolls a new Cloud Run revision. It does NOT touch any existing env vars
      # on the service — all secrets (SECRET_KEY, RESEND_API_KEY, etc.) remain
      # configured on the Cloud Run service itself and are untouched by this
      # command.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --source . \
            --region ${{ env.REGION }} \
            --project ${{ secrets.GCP_PROJECT }} \
            --quiet
