<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - JokesFor</title>

    <!-- Human visitors: bounce straight to the SPA joke page. Social
         scrapers (Facebook/Twitter/Slack/etc.) fetch this URL without
         executing JS and without honoring meta-refresh, so they only ever
         see the OG/Twitter/JSON-LD tags below; real browsers redirect
         immediately. -->
    <meta http-equiv="refresh" content="0; url={{ frontend_joke_url }}">
    <link rel="canonical" href="{{ frontend_joke_url }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />
    {% if share_image_url %}
    <meta property="og:image" content="{{ share_image_url }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    {% endif %}
    <meta property="og:type" content="article" />
    <meta property="og:url" content="{{ frontend_joke_url }}" />
    <meta property="og:site_name" content="JokesFor" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ title }}" />
    <meta name="twitter:description" content="{{ description }}" />
    {% if share_image_url %}
    <meta name="twitter:image" content="{{ share_image_url }}" />
    {% endif %}

    {{ json_ld_script }}

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 600px;
            background: #16213e;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
        }
        .joke-text {
            font-size: 24px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .cta {
            margin-top: 30px;
        }
        .cta a {
            display: inline-block;
            background: #e94560;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
        }
        .cta a:hover {
            background: #c73e54;
        }
        .branding {
            margin-top: 40px;
            opacity: 0.7;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        {% if badge_text %}
        <span class="badge">{{ badge_text }}</span>
        {% endif %}
        <p class="joke-text">{{ joke.text }}</p>
        <div class="cta">
            <a href="{{ frontend_joke_url }}">Open in JokesFor</a>
        </div>
    </div>
    <p class="branding">JokesFor</p>

    <script>location.replace("{{ frontend_joke_url|escapejs }}");</script>
</body>
</html>
